# nginx for the web image: serves the built React app (web/dist). Caddy sits in front of
# it and handles HTTPS, /api and /media; this server only ever sees the site's own files.
server {
    # 8080, not 80: this nginx runs as a normal user, and only root may use ports < 1024.
    listen 8080;
    root /usr/share/nginx/html;

    # Hashed build files (index-DG_OzM0T.js): the name changes whenever the content does,
    # so browsers may keep them for a year without ever asking again.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app. A real file (favicon.svg) is served as is;
    # any other path (/groups/123, /profile) gets index.html and React Router takes over.
    # no-cache: browsers re-check index.html on every visit, so after a deploy they get the
    # new file names at once (that's how the "new version, reload" page is avoided).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
