# The whole production stack. Secrets come from .env.prod (never committed; template:
# .env.prod.example, generate with `npm run prod:env`).
#   npm run prod:up     build the images and start everything (waits until healthy)
#   npm run prod:logs   follow the logs
#   npm run prod:down   stop (data stays in the volumes)
#
#   browser ──https──▶ caddy ─┬─ /api/*   ─▶ api ─┬─▶ postgres
#                              ├─ /media/* ─▶ garage (avatars)
#                              └─ the rest ─▶ web (nginx + built React app)
#
# Only caddy publishes ports. Every other service is reachable only inside this
# project's private Docker network, by its service name (api:3000, postgres:5432, ...).

# Its own project name: production containers and volumes never mix with the dev ones.
name: urconnections-prod

# YAML anchor (&): settings shared by `api` and `migrate`, pasted in below with *api-env.
# ${VAR:?message} = required: compose refuses to start and prints the message if unset.
x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-urconnections}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:-urconnections}
  APP_ORIGIN: ${APP_ORIGIN:-https://localhost}
  SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env.prod}
  MAIL_FROM: ${MAIL_FROM:-UrConnections <no-reply@urconnections.local>}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  S3_ENDPOINT: http://garage:3900
  S3_REGION: garage
  S3_BUCKET: ${S3_BUCKET:-urconnections}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env.prod}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env.prod}

# Both services run the same image; compose builds it once per `up --build`.
# Image names: on your computer `urconnections-api:latest`, built locally by `npm run prod:up`.
# On the server (Stage 15) .env.prod sets IMAGE_PREFIX=ghcr.io/<owner>/ and scripts/deploy.sh
# sets IMAGE_TAG to the commit, so the server pulls the images CI built instead of building.
x-api-build: &api-build
  context: .
  dockerfile: api/Dockerfile

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      S3_BUCKET: ${S3_BUCKET:-urconnections}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates (and the local CA for "localhost"): keep them across restarts
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: ${IMAGE_PREFIX:-}urconnections-web:${IMAGE_TAG:-latest}
    restart: unless-stopped

  api:
    build: *api-build
    image: ${IMAGE_PREFIX:-}urconnections-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *api-env
    depends_on:
      # Start only after the database schema is up to date and storage is ready.
      migrate:
        condition: service_completed_successfully
      garage:
        condition: service_healthy

  # One-off job: applies new migrations, then exits. `api` waits for it to finish
  # successfully, so the API never runs against an outdated schema.
  migrate:
    build: *api-build
    image: ${IMAGE_PREFIX:-}urconnections-api:${IMAGE_TAG:-latest}
    command: ["node", "dist/db/migrate.js", "latest"]
    environment: *api-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urconnections}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-urconnections}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env.prod}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-urconnections}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env.prod}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env.prod}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Nightly pg_dump into the "backups" volume (docker/backup/backup.sh).
  # On demand: npm run prod:backup
  # Copying them off the server comes in Stage 14.
  backup:
    image: postgres:18-alpine # same major as the database, so pg_dump matches the server
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-urconnections}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      PGDATABASE: ${POSTGRES_DB:-urconnections}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      # After the schema exists: the first backup runs at once, and a dump taken before
      # `migrate` would be a backup of an empty database (found by a restore test).
      migrate:
        condition: service_completed_successfully

  # Off-site copies of the backups (Stage 14, docker/backup/offsite.sh): every 6 hours, new
  # dumps go to an S3-compatible bucket at another company (Cloudflare R2), kept OFFSITE_KEEP_DAYS.
  # Opt-in through a profile: it runs only where .env.prod sets COMPOSE_PROFILES=offsite (the
  # server), so `npm run prod:up` on your computer works without a bucket.
  offsite:
    image: rclone/rclone:1.71.2
    profiles: ["offsite"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/offsite.sh"]
    environment:
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-30}
      # rclone builds its "r2" remote from these variables (no config file to manage).
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_ACCESS_KEY:-}
      # The key may only touch its own bucket, so don't try to list or create buckets.
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    volumes:
      - ./docker/backup/offsite.sh:/offsite.sh:ro
      - backups:/backups:ro # read-only: this service can never change the local backups

volumes:
  pgdata:
  garage:
  backups:
  caddy_data:
  caddy_config:
